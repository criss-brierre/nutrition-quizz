/* ---------------- Images depuis Wikipédia ---------------- */
const IMG = {}; // "lang:Titre" -> {src, file}

async function fetchImages(){
  const byLang = {};
  QUESTIONS.forEach(q => q.items.forEach(it => it.wiki.forEach(w => {
    const [lang, title] = w.startsWith("fr:") ? ["fr", w.slice(3)] : ["en", w];
    (byLang[lang] = byLang[lang] || new Set()).add(title);
  })));
  const jobs = [];
  for (const lang in byLang){
    const titles = [...byLang[lang]];
    for (let i = 0; i < titles.length; i += 45){
      jobs.push(fetchBatch(lang, titles.slice(i, i + 45)));
    }
  }
  await Promise.allSettled(jobs);
}

async function fetchBatch(lang, titles){
  const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*`
    + `&prop=pageimages&piprop=thumbnail|name&pithumbsize=500&redirects=1`
    + `&titles=${encodeURIComponent(titles.join("|"))}`;
  const res = await fetch(url);
  const data = await res.json();
  const q = data.query || {};
  // Remonter du titre final vers le titre demandé (normalisation + redirections)
  const back = {};
  (q.normalized || []).forEach(x => back[x.to] = x.from);
  (q.redirects || []).forEach(x => back[x.to] = back[x.from] || x.from);
  Object.values(q.pages || {}).forEach(p => {
    if (!p.thumbnail) return;
    const requested = back[p.title] || p.title;
    const info = { src: p.thumbnail.source, file: p.pageimage };
    IMG[lang + ":" + requested] = info;
    IMG[lang + ":" + p.title] = info;
  });
}

function imageFor(item){
  for (const w of item.wiki){
    const key = w.startsWith("fr:") ? w : "en:" + w;
    if (IMG[key]) return IMG[key];
  }
  return null;
}

/* ---------------- Logique du quiz ---------------- */
const app = document.getElementById("app");
const scoreEl = document.getElementById("score");
const barEl = document.getElementById("bar");
let idx = 0, score = 0, answers = [], imagesReady;

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const tagHTML = up => up ? '<span class="tag up">🏭 ultra-transformé</span>' : '<span class="tag raw">🌱 brut</span>';

function updateHeader(){
  scoreEl.textContent = idx < QUESTIONS.length || answers.length ? `Score : ${score}/${answers.length}` : "";
  barEl.style.width = (answers.length / QUESTIONS.length * 100) + "%";
}

function renderStart(){
  scoreEl.textContent = "";
  barEl.style.width = "0";
  app.innerHTML = `
    <div class="card center">
      <div class="big">🔥</div>
      <h2>Le quiz des calories</h2>
      <p class="unit">${QUESTIONS.length} questions en 2 parties, avec 4 aliments à chaque fois.<br>
      <strong>Partie 1 :</strong> trouve le <strong>plus</strong> calorique. <strong>Partie 2 :</strong> trouve le <strong>moins</strong> calorique.<br>
      Attention aux pièges : un aliment « healthy » n'est pas toujours léger, et un aliment industriel n'est pas toujours le plus calorique.</p>
      <div class="legend">${tagHTML(true)} ${tagHTML(false)}</div>
      <button class="btn" id="go">C'est parti !</button>
    </div>`;
  document.getElementById("go").onclick = () => { idx = 0; score = 0; answers = []; renderQuestion(); };
}

function renderQuestion(){
  updateHeader();
  const q = QUESTIONS[idx];
  const items = shuffle(q.items);
  const isMin = q.mode === "min";
  const maxK = isMin ? Math.min(...q.items.map(i => i.k)) : Math.max(...q.items.map(i => i.k));
  app.innerHTML = `
    <div class="card">
      <p class="qnum">Question ${idx + 1} / ${QUESTIONS.length} · ${isMin ? "Partie 2 : le moins calorique" : "Partie 1 : le plus calorique"}</p>
      <h2>${q.title}</h2>
      <p class="unit">${q.unit} : lequel est le <strong class="${isMin ? "kw-min" : "kw-max"}">${isMin ? "MOINS" : "PLUS"} calorique</strong> ?</p>
      <div class="choices" id="choices">
        ${items.map((it, i) => `
          <button class="choice" data-i="${i}">
            <div class="imgbox" data-img="${i}">${it.emoji}</div>
            <div class="cname"><span>${it.n}</span><span class="kcal">${it.k} kcal</span></div>
          </button>`).join("")}
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="feedback" id="feedback"></div>
    </div>`;

  const paint = () => items.forEach((it, i) => {
    const info = imageFor(it);
    if (!info) return;
    const box = app.querySelector(`[data-img="${i}"]`);
    if (!box) return;
    const im = new Image();
    im.onload = () => { box.style.backgroundImage = `url("${info.src}")`; box.textContent = ""; };
    im.src = info.src;
    box.dataset.file = info.file || "";
  });
  imagesReady.then(paint);

  app.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => answer(items, +btn.dataset.i, maxK);
  });
}

function answer(items, chosen, maxK){
  const q = QUESTIONS[idx];
  const ok = items[chosen].k === maxK;
  if (ok) score++;
  answers.push({ q: q.title, ok, chosen: items[chosen].n, right: items.find(i => i.k === maxK).n });
  updateHeader();

  const box = document.getElementById("choices");
  box.classList.add("revealed");
  box.querySelectorAll(".choice").forEach((btn, i) => {
    btn.disabled = true;
    if (items[i].k === maxK) btn.classList.add("correct");
    else if (i === chosen) btn.classList.add("wrong");
    else btn.classList.add("dim");
    const f = btn.querySelector(".imgbox").dataset.file;
    if (f){
      btn.disabled = false;
      btn.onclick = () => window.open("https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(f), "_blank", "noopener");
      btn.title = "Voir la source de la photo";
    }
  });

  const v = document.getElementById("verdict");
  v.className = "verdict " + (ok ? "good" : "bad");
  v.textContent = ok ? "✅ Bonne réponse !" : `❌ Raté ! C'était : ${items.find(i => i.k === maxK).n}`;

  const isMin = q.mode === "min";
  const ranked = q.items.slice().sort((a, b) => isMin ? a.k - b.k : b.k - a.k);
  const topK = Math.max(...q.items.map(i => i.k));
  const fb = document.getElementById("feedback");
  fb.innerHTML = `
    <p class="expl">💡 ${q.expl}</p>
    <div class="rank">
      <h3>Classement du ${isMin ? "moins" : "plus"} au ${isMin ? "plus" : "moins"} calorique (${q.unit.toLowerCase()})</h3>
      ${ranked.map((it, i) => `
        <div class="bar ${i === 0 ? (isMin ? "first low" : "first") : ""}">
          <span class="pos">${i + 1}</span>
          <div class="track">
            <div class="fill" style="width:0" data-w="${Math.max(8, it.k / topK * 100)}"></div>
            <div class="lbl">${it.n} · ${it.k} kcal ${tagHTML(it.up)}</div>
          </div>
        </div>`).join("")}
    </div>
    <button class="btn" id="next">${idx + 1 < QUESTIONS.length ? "Question suivante →" : "Voir mon résultat"}</button>`;
  fb.classList.add("show");
  requestAnimationFrame(() => fb.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
  document.getElementById("next").onclick = () => {
    idx++;
    if (idx === PART2_START) renderTransition();
    else idx < QUESTIONS.length ? renderQuestion() : renderEnd();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  v.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderTransition(){
  updateHeader();
  app.innerHTML = `
    <div class="card center">
      <div class="big">🔄</div>
      <h2>Partie 2 : on inverse !</h2>
      <p class="unit">Fin de la partie 1 : ${score} / ${PART2_START}.<br><br>
      Maintenant, trouve l'aliment le <strong class="kw-min">MOINS calorique</strong>.<br>
      Méfie-toi encore des aliments qui ont l'air « light »…</p>
      <button class="btn" id="go2">Continuer →</button>
    </div>`;
  document.getElementById("go2").onclick = renderQuestion;
}

function renderEnd(){
  updateHeader();
  const pct = score / QUESTIONS.length;
  const msg = pct >= .8 ? ["🏆", "Expert ! Tu ne te fais pas avoir par les pièges."]
            : pct >= .5 ? ["👍", "Pas mal ! Quelques pièges t'ont eu, relis les explications."]
            : ["📚", "Les apparences sont trompeuses… Refais le quiz pour bien retenir !"];
  app.innerHTML = `
    <div class="card center">
      <div class="big">${msg[0]}</div>
      <h2>${score} / ${QUESTIONS.length}</h2>
      <p class="unit">${msg[1]}</p>
      <ul class="recap">
        ${answers.map((a, i) => `<li>${a.ok ? "✅" : "❌"} <strong>${i + 1}. ${a.q}</strong>${a.ok ? "" : ` · tu as choisi ${a.chosen}, c'était ${a.right}`}</li>`).join("")}
      </ul>
      <div class="takeaway">
        <strong>À retenir</strong><br>
        • La plupart des ultra-transformés 🏭 concentrent beaucoup de calories dans peu de volume et rassasient mal.<br>
        • Mais le brut 🌱 n'est pas toujours léger : huiles, oléagineux et poissons gras se dosent.<br>
        • Méfie-toi des produits « light » (biscottes, galettes de riz) et lis les étiquettes (thon au naturel plutôt qu'à l'huile).<br>
        • Aliments peu caloriques à ajouter : poisson blanc, thon au naturel, blanc de poulet ou de dinde, cottage cheese, skyr ou fromage blanc 0 %, pomme de terre à l'eau, edamame, fruits entiers (fraises), légumes à volonté (concombre).
      </div>
      <button class="btn" id="again">Rejouer 🔁</button>
    </div>`;
  document.getElementById("again").onclick = renderStart;
}

imagesReady = fetchImages().catch(() => {});
renderStart();
</script>

</html>
